name: vyarth
description: Scan for unused Python and upload SARIF
inputs:
  path:
    description: Directory or file to scan
    required: false
    default: "."
  min-confidence:
    description: Drop findings below this score
    required: false
    default: "0"
  fail-on:
    description: Exit 1 at this band. high, medium, low, or empty
    required: false
    default: ""
  baseline:
    description: Baseline file. Empty skips it
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Scan
      id: scan
      shell: bash
      run: |
        args=(scan "${{ inputs.path }}" --format sarif --quiet)
        if [ -n "${{ inputs.min-confidence }}" ]; then
          args+=(--min-confidence "${{ inputs.min-confidence }}")
        fi
        if [ -n "${{ inputs.fail-on }}" ]; then
          args+=(--fail-on "${{ inputs.fail-on }}")
        fi
        if [ -n "${{ inputs.baseline }}" ]; then
          args+=(--baseline "${{ inputs.baseline }}")
        fi
        set +e
        vyarth "${args[@]}" > vyarth.sarif
        code=$?
        set -e
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: vyarth.sarif
    - name: Exit with the scan code
      if: always()
      shell: bash
      run: exit "${{ steps.scan.outputs.code }}"
